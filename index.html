<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цифровой паспорт озёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: header, left catalog rail, full map, right passport drawer. Palette: limnic teal on mineral grey. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eaefee; --ink:#18252a; --muted:#5b6b70; --line:#d5dddc;
  --accent:#0b6e79; --accent-ink:#ffffff; --accent-soft:#d6ecee;
  --water:#c9dde3; --land:#f4f1ea; --land-az:#fbfaf6; --border-c:#9aa7a6; --az-border:#3c5258;
  --lake:#1b7fa6; --lake-sel:#e2611f;
  --good:#2f8a4c; --warn:#c08a12; --bad:#c2452d; --crit:#8e1f3a;
  --f-display:"Noto Serif",Georgia,serif; --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Noto Sans Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0f1719; --surface:#162226; --surface-2:#1d2c31; --ink:#e3ecec; --muted:#93a6a9; --line:#2a3b40;
  --accent:#4fb8c3; --accent-ink:#06282c; --accent-soft:#173a3f;
  --water:#13303a; --land:#1e2a2c; --land-az:#26363a; --border-c:#4a5c5f; --az-border:#9cb9bd;
  --lake:#5cc3e6; --lake-sel:#ff9a5c; --good:#5cc27c; --warn:#e3b341; --bad:#ef7a62; --crit:#e46a8a;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0f1719; --surface:#162226; --surface-2:#1d2c31; --ink:#e3ecec; --muted:#93a6a9; --line:#2a3b40;
  --accent:#4fb8c3; --accent-ink:#06282c; --accent-soft:#173a3f;
  --water:#13303a; --land:#1e2a2c; --land-az:#26363a; --border-c:#4a5c5f; --az-border:#9cb9bd;
  --lake:#5cc3e6; --lake-sel:#ff9a5c; --good:#5cc27c; --warn:#e3b341; --bad:#ef7a62; --crit:#e46a8a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:relative;z-index:950;display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font:700 18px/1.2 var(--f-display);margin:0;letter-spacing:.01em}
header .sub{color:var(--muted);font-size:12px}
header .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.off{background:var(--warn)}
main{flex:1;display:flex;min-height:0;position:relative}
aside#rail{width:340px;flex:none;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);min-height:0}
.rail-top{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:var(--surface-2);border-radius:6px;padding:6px 8px}
.tile b{display:block;font:600 16px/1.2 var(--f-body);font-variant-numeric:tabular-nums}
.tile span{font-size:10.5px;color:var(--muted);line-height:1.2;display:block}
input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
textarea{resize:vertical;min-height:56px}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:6px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
#list{flex:1;overflow:auto;padding:4px 0}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 12px;border-left:3px solid transparent;cursor:pointer}
.item:hover{background:var(--surface-2)}
.item.sel{border-left-color:var(--lake-sel);background:var(--accent-soft)}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{grid-column:1;font-size:12px;color:var(--muted)}
.item .ar{grid-row:1/3;grid-column:2;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);align-self:center}
.item .ar b{display:block;color:var(--ink);font-size:13px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px;grid-column:1}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{padding:24px 16px;color:var(--muted);text-align:center}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--surface-2);color:var(--muted);font-weight:600}
.chip.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.chip.crit{background:color-mix(in srgb,var(--crit) 20%,transparent);color:var(--crit)}
.chip.demo{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--water)}
.leaflet-container{font:inherit;background:var(--water)}
.maptools{position:absolute;top:10px;left:50px;z-index:500;display:flex;gap:6px;flex-wrap:wrap}
.maptools .btn{box-shadow:0 1px 4px rgba(0,0,0,.18)}
.maptools .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#coords{position:absolute;left:60px;bottom:10px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font:12px var(--f-mono);font-variant-numeric:tabular-nums}
#hint{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:500;background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:6px;font-size:13px;display:none;max-width:90%}
#measure{position:absolute;right:10px;bottom:10px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;display:none;font-variant-numeric:tabular-nums}
.leaflet-tooltip{font:12px var(--f-body);background:var(--surface);color:var(--ink);border-color:var(--line)}
.leaflet-tooltip-top:before{border-top-color:var(--line)}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-color:var(--line)}
.leaflet-control-scale-line{background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--ink);border-color:var(--ink)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--accent)}
/* drawer */
#drawer{position:absolute;top:0;right:0;bottom:0;width:460px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);z-index:600;display:none;flex-direction:column;box-shadow:-4px 0 18px rgba(0,0,0,.12)}
#drawer.open{display:flex}
.dh{padding:14px 16px 0;display:flex;flex-direction:column;gap:6px}
.dh .top{display:flex;align-items:flex-start;gap:8px}
.dh h2{font:700 21px/1.2 var(--f-display);margin:0;flex:1;text-wrap:balance}
.dh .ids{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 10px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.db{flex:1;overflow:auto;padding:14px 16px 24px}
.sec{margin-bottom:18px}
.sec h3{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
dl.kv{display:grid;grid-template-columns:minmax(120px,44%) 1fr;gap:5px 12px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
dl.kv dd.na{color:var(--line)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:12px;color:var(--muted)}
.warnbox{font-size:12px;padding:8px 10px;border-radius:6px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink);margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th{color:var(--muted);font-weight:600;font-size:11.5px}
table.t th:first-child,table.t td:first-child{text-align:left}
.tw{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.photos figure{margin:0;background:var(--surface-2);border-radius:6px;overflow:hidden;position:relative}
.photos img{width:100%;height:100px;object-fit:cover;display:block;cursor:zoom-in}
.photos figcaption{font-size:11.5px;padding:4px 6px;color:var(--muted)}
.photos .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:4px;padding:0 6px;font-size:13px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,22,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--surface);border-radius:10px;max-width:640px;width:100%;max-height:90%;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox h3{font:700 18px/1.2 var(--f-display);margin:0 0 10px}
.mbox img.big{max-width:100%;display:block;margin:auto;border-radius:6px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
progress{width:100%}
pre.copy{max-height:260px;overflow:auto;background:var(--surface-2);padding:8px;border-radius:6px;font:11px var(--f-mono);white-space:pre-wrap;word-break:break-all}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:1100;font-size:13px;display:none;max-width:90%}
@media (max-width:820px){
  aside#rail{position:absolute;inset:0 auto 0 0;z-index:700;width:100%;display:none}
  aside#rail.open{display:flex}
  #railToggle{display:inline-flex!important}
  #drawer{width:100%}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
#railToggle{display:none}
#userbox[hidden]{display:none!important}
#gate{position:fixed;inset:0;z-index:900;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#gate.open{display:flex}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.gbox h2{font:700 22px/1.2 var(--f-display);margin:0 0 4px}
.gform{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.gform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.glinks{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.glinks .btn{color:var(--accent)}
.leaflet-control-layers{background:var(--surface);color:var(--ink);border-color:var(--line)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <button class="btn sm" id="railToggle" data-i18n="catalog">Каталог</button>
  <div>
    <h1 data-i18n="title">Цифровой паспорт озёр</h1>
    <div class="sub" data-i18n="subtitle">Лаборатория геопространственной аналитики и картографии · Институт географии</div>
  </div>
  <div class="sp"></div>
  <div class="status"><span class="dot" id="dbdot"></span><span id="dbstat">…</span></div>
  <div id="userbox" style="display:flex;gap:6px;flex-wrap:wrap" hidden>
    <button class="btn sm" id="btn-members" hidden data-i18n="members">Сотрудники</button>
    <button class="btn sm" id="btn-pass" data-i18n="changePass">Пароль</button>
    <button class="btn sm" id="btn-out" data-i18n="signOut">Выйти</button>
  </div>
  <div class="seg" role="group" aria-label="Language">
    <button id="lang-ru" aria-pressed="true">RU</button><button id="lang-az" aria-pressed="false">AZ</button><button id="lang-en" aria-pressed="false">EN</button>
  </div>
</header>
<main>
  <aside id="rail">
    <div class="rail-top">
      <div class="tiles">
        <div class="tile"><b id="s-n">0</b><span data-i18n="sLakes">озёр</span></div>
        <div class="tile"><b id="s-a">—</b><span data-i18n="sArea">площадь, км²</span></div>
        <div class="tile"><b id="s-g">0</b><span data-i18n="sGeom">с контуром</span></div>
        <div class="tile"><b id="s-c">—</b><span data-i18n="sFill">заполнено</span></div>
      </div>
      <input type="search" id="q" data-i18n-ph="search" placeholder="Поиск по названию, району, коду">
      <div class="row">
        <select id="f-region" aria-label="region"></select>
        <select id="f-origin" aria-label="origin"></select>
      </div>
      <div class="row">
        <select id="f-country" aria-label="country"></select>
      </div>
      <div class="row">
        <select id="f-sort" aria-label="sort"></select>
        <button class="btn pri" id="btn-new" data-i18n="newLake">+ Озеро</button>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div class="maptools">
      <button class="btn" id="btn-import" data-i18n="import">Импорт контуров</button>
      <button class="btn" id="btn-measure" aria-pressed="false" data-i18n="measure">Измерить</button>
      <button class="btn" id="btn-export" data-i18n="exportAll">Экспорт</button>
      <button class="btn" id="btn-fit" data-i18n="fitAll">Все озёра</button>
    </div>
    <div id="hint"></div>
    <div id="coords">—</div>
    <div id="measure"></div>
    <section id="drawer" aria-label="passport">
      <div class="dh">
        <div class="top"><h2 id="d-title">—</h2><button class="btn ghost" id="d-close" aria-label="close">✕</button></div>
        <div class="ids" id="d-ids"></div>
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="pass" aria-selected="true" data-i18n="tPass">Паспорт</button>
          <button role="tab" data-tab="morph" aria-selected="false" data-i18n="tMorph">Морфометрия</button>
          <button role="tab" data-tab="obs" aria-selected="false" data-i18n="tObs">Мониторинг</button>
          <button role="tab" data-tab="photo" aria-selected="false" data-i18n="tPhoto">Фото</button>
          <button role="tab" data-tab="exp" aria-selected="false" data-i18n="tExp">Экспорт</button>
        </div>
      </div>
      <div class="db" id="d-body"></div>
    </section>
  </div>
</main>
<div id="gate" aria-live="polite"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" hidden accept=".geojson,.json,.zip,.kml,.csv">
<input type="file" id="photoIn" hidden accept="image/*" multiple>

const optLabel = (list, key) => { const o=(LISTS[list]||[]).find(x=>x[0]===key); return o?lbl(o):(key||"—"); };
function toast(msg, ms=2600){ const el=$("#toast"); el.textContent=msg; el.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display="none",ms); }
function completeness(l){ let n=0; for(const k of FILL_KEYS){ const v=l[k]; if(v!==undefined&&v!==null&&v!=="") n++; } return Math.round(100*n/FILL_KEYS.length); }
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function renderLayer(){

      if(z < 10 && l.lat!=null) { const pt = L.circleMarker([l.lat,l.lon],{radius:4,...lakeStyle(l.id),fillOpacity:.9}); lay = L.featureGroup([lay, pt]); }
    } else if(isFinite(+l.lat) && isFinite(+l.lon) && l.lat!==null && l.lat!=="") {
      lay = L.circleMarker([+l.lat,+l.lon], {radius:6, ...lakeStyle(l.id), fillOpacity:.85});

let mode = null, placeCb = null, measurePts = [], measureLine = null;
function setHint(s){ const h=$("#hint"); h.textContent=s||""; h.style.display=s?"block":"none"; }
function startPlace(cb){ mode="place"; placeCb=cb; setHint(t("clickMap")); map.getContainer().style.cursor="crosshair"; }
function endMode(){ mode=null; placeCb=null; setHint(""); map.getContainer().style.cursor=""; $("#btn-measure").setAttribute("aria-pressed","false"); map.doubleClickZoom.enable(); }
function resetMeasure(){ measurePts=[]; if(measureLine){ measureLine.remove(); measureLine=null; } $("#measure").style.display="none"; }
map.on("click", e=>{
  if(mode==="place"){ const cb=placeCb; endMode(); cb && cb(e.latlng); return; }
  if(mode==="measure"){ measurePts.push([e.latlng.lng, e.latlng.lat]); updateMeasure(); }
});
map.on("dblclick", e=>{ if(mode==="measure"){ endMode(); } });
function updateMeasure(){
  if(measureLine) measureLine.remove();
  const ll = measurePts.map(p=>[p[1],p[0]]);
  measureLine = measurePts.length>=3 ? L.polygon(ll,{color:css("--lake-sel"),weight:2,dashArray:"5 4",fillOpacity:.08}) : L.polyline(ll,{color:css("--lake-sel"),weight:2,dashArray:"5 4"});
  measureLine.addTo(map);
  const el=$("#measure"); el.style.display="block";
  let s = "";
  if(measurePts.length>=2){ const len = turf.length(turf.lineString(measurePts),{units:"kilometers"}); s += `${t("dist")}: <b>${num(len,3)} ${t("km")}</b>`; }

  el.innerHTML = s || "…";
}
$("#btn-measure").onclick = ()=>{

function filtered(){

let detailToken = 0;
async function subscribeDetail(id){
  obsRows=[]; photoRows=[];
  if(!id || !sb) return;
  const tok = ++detailToken;
  await Promise.all([loadObs(id, tok), loadPhotos(id, tok)]);
}
async function loadObs(id, tok){
  try{ const rows = chk(await sb.from("lake_obs").select("*").eq("lake_id", id).order("date"));
    if(tok!==undefined && tok!==detailToken) return; if(selId!==id) return;
    obsRows = rows; if(tab==="obs" && !editing) renderDrawer(); updIds();
  }catch(err){ failMsg(err); }
}
async function loadPhotos(id, tok){
  try{ const rows = chk(await sb.from("lake_photos").select("*").eq("lake_id", id).order("created_at"));
    if(rows.length){ const urls = chk(await sb.storage.from("lake-photos").createSignedUrls(rows.map(r=>r.path), 3600));
      rows.forEach((r,i)=>{ r.data = urls[i] && urls[i].signedUrl; r.at = r.created_at; }); }
    if(tok!==undefined && tok!==detailToken) return; if(selId!==id) return;
    photoRows = rows; if(tab==="photo") renderDrawer();
  }catch(err){ failMsg(err); }
}

function fieldValue(f, v){
  if(v===undefined||v===null||v==="") return null;
  const [k,,,type]=f;
  if(type==="num") return num(v, (k==="lat"||k==="lon")?5:3);
  if(type.startsWith("sel:")){ const list=type.slice(4); if(list==="STATUS"){ const s=STATUS.find(x=>x[0]===v); return s?`<span class="chip ${s[3]}">${esc(lbl(s))}</span>`:esc(v); } return esc(optLabel(list, v)); }
  return esc(v).replace(/\n/g,"<br>");
}
function passView(l){
  let h = l.demo ? `<div class="warnbox">${esc(t("demoNote"))}</div>` : "";
  for(const [g,gk] of GROUPS){

    for(const f of F.filter(f=>f[4]===g)){ const v=fieldValue(f,l[f[0]]); h += `<dt>${esc(fl(f))}</dt><dd class="${v===null?"na":""}">${v===null?"—":v}</dd>`; }

function input(f, v){

function passForm(l){

  for(const [g,gk] of GROUPS){ h += `<div class="sec"><h3>${esc(t(gk))}</h3><div class="form">${F.filter(f=>f[4]===g).map(f=>input(f,l[f[0]])).join("")}</div></div>`; }

function morphCalc(id){
  const g = geoms.get(id); if(!g || !g.geometry) return null;
  const feat = {type:"Feature", properties:{}, geometry:g.geometry};
  const A = turf.area(feat)/1e6;
  let P = 0; try{ const ln = turf.polygonToLine(feat); P = turf.length(ln,{units:"kilometers"}); }catch(e){}
  const Ks = A>0 ? P/(2*Math.sqrt(Math.PI*A)) : null;
  const c = turf.centroid(feat).geometry.coordinates;
  const bb = turf.bbox(feat);
  const ew = turf.distance([bb[0],(bb[1]+bb[3])/2],[bb[2],(bb[1]+bb[3])/2]), ns = turf.distance([(bb[0]+bb[2])/2,bb[1]],[(bb[0]+bb[2])/2,bb[3]]);
  const parts = g.geometry.type==="MultiPolygon" ? g.geometry.coordinates.length : 1;
  return {A,P,Ks,c,len:Math.max(ew,ns),wid:Math.min(ew,ns),parts};
}
function morphView(l){
  const m = morphCalc(l.id);
  if(!m) return `<p class="note">${esc(t("noGeom"))}</p>${canEditLake(l)?`<div class="actions"><button class="btn pri" data-act="geom">${esc(t("replaceGeom"))}</button></div>`:""}`;

    <dt>${esc(t("mPer"))}</dt><dd>${num(m.P,3)} ${t("km")}</dd>
    <dt>${esc(t("mKs"))}</dt><dd>${num(m.Ks,3)}</dd>
    <dt>${esc(t("mBbox"))}</dt><dd>${num(m.len,3)} × ${num(m.wid,3)} ${t("km")}</dd>
    <dt>${esc(t("mCen"))}</dt><dd>${m.c[1].toFixed(5)}° N, ${m.c[0].toFixed(5)}° E</dd>
    <dt>${esc(t("mParts"))}</dt><dd>${m.parts}</dd>
  </dl></div><p class="note">${esc(t("mFrom"))}</p>

}
let chartParam = "level";
function chartSVG(rows, key){
  const pts = rows.filter(r=>r[key]!==undefined&&r[key]!==null&&r[key]!==""&&r.date).map(r=>({x:new Date(r.date).getTime(), y:+r[key], d:r.date})).filter(p=>isFinite(p.x)&&isFinite(p.y));
  if(pts.length<1) return `<p class="note">—</p>`;
  const W=420,H=170,pl=44,pr=12,pt=12,pb=26;
  let x0=Math.min(...pts.map(p=>p.x)), x1=Math.max(...pts.map(p=>p.x)); if(x0===x1){x0-=864e5*30;x1+=864e5*30;}
  let y0=Math.min(...pts.map(p=>p.y)), y1=Math.max(...pts.map(p=>p.y)); if(y0===y1){y0-=1;y1+=1;} const pad=(y1-y0)*0.12; y0-=pad; y1+=pad;
  const X=v=>pl+(v-x0)/(x1-x0)*(W-pl-pr), Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  const ticks=4, grid=[]; for(let i=0;i<=ticks;i++){ const v=y0+(y1-y0)*i/ticks; grid.push(`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${num(v,2)}</text>`); }
  const line = pts.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const areaP = line + `L${X(pts[pts.length-1].x).toFixed(1)},${H-pb}L${X(pts[0].x).toFixed(1)},${H-pb}Z`;
  const last=pts[pts.length-1];

    ${pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.5" fill="var(--accent)"><title>${esc(p.d)}: ${p.y}</title></circle>`).join("")}

}

async function putGeom(id, geometry){

function compressImage(file){
  return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ let w=img.naturalWidth,h=img.naturalHeight; const max=2048; if(Math.max(w,h)>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("image")), "image/jpeg", 0.85); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("image")); }; img.src=url; });
}

  try{
  for(const f of feats){
    const p=f.properties||{}, d={}, m={...mapping};
    for(const fd of F){ if(m[fd[0]]===undefined && p[fd[0]]!==undefined) m[fd[0]]=fd[0]; }
    for(const [k,src] of Object.entries(m)){ let v=p[src]; if(v===undefined||v===null||v==="") continue; const fd=F.find(x=>x[0]===k); if(fd[3]==="num"){ v=+String(v).replace(",","."); if(!isFinite(v)) continue; } else v=String(v); d[k]=v; }
    if(!d.region && regionAll) d.region=regionAll;
    if(!d.country || !COUNTRY.some(c=>c[0]===d.country)) d.country = countryAll || "AZ";
    const skipKeys = new Set([...used, ...F.map(x=>x[0]), "id","updatedAt","updated_at"]);
    const attrs={}; for(const [k,v] of Object.entries(p)){ if(!skipKeys.has(k) && v!==null && v!=="" && typeof v!=="object") attrs[k]=String(v).slice(0,300); }
    if(Object.keys(attrs).length) d.attrs=attrs;
    if(/Polygon/.test(f.geometry.type)){ const c=turf.centroid(f).geometry.coordinates; if(d.lat===undefined){ d.lat=+c[1].toFixed(6); d.lon=+c[0].toFixed(6); } if(auto && (d.area===undefined)) d.area=+(turf.area(f)/1e6).toFixed(4); d.geojson=(await putGeom(null, f.geometry)).geometry; }
    else { d.lat=+f.geometry.coordinates[1].toFixed(6); d.lon=+f.geometry.coordinates[0].toFixed(6); }
    if(!d.name) d.name = `${t("newName")} ${n+batch.length+1}`;
    batch.push(clean(d));
    if(batch.length>=25) await flush();
  }
  await flush();
  }catch(err){ failMsg(err); }
  renderList(); renderLayer();
  closeModal(); toast(`${t("impDone")}: ${n}`, 4000); setTimeout(fitAll, 400);
}

/* ---------- export ---------- */
function save(filename, data, type){
  const blob = new Blob([data], {type: type || (/\.html$/.test(filename)?"text/html":/\.csv$/.test(filename)?"text/csv":"application/geo+json")+";charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function printPassport(l){
  const w = window.open("", "_blank"); if(!w){ save(`passport_${slug(l.name)}.html`, passportHTML(l)); return; }
  w.document.open(); w.document.write(passportHTML(l).replace("</body>","<script>setTimeout(()=>print(),400)<\/script></body>")); w.document.close();
}
async function ensureGeom(id){ const g=geoms.get(id); return g ? g.geometry : null; }
function props(l){ const o={id:l.id}; for(const f of F){ if(l[f[0]]!==undefined && l[f[0]]!=="") o[f[0]]=l[f[0]]; } o.updated_at=l.updated_at||""; o.updated_by=l.updated_by_email||""; return o; }
const slug = s => String(s||"lake").normalize("NFKD").replace(/[^\w\-]+/g,"_").replace(/_+/g,"_").slice(0,40);
const csvCell = v => { v = v===undefined||v===null ? "" : String(v); return /[",;\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
async function doExport(kind, l){
  const today = new Date().toISOString().slice(0,10);
  if(kind==="geo"){ const g=await ensureGeom(l.id); const geometry = g || (l.lat!=null&&l.lat!==""?{type:"Point",coordinates:[+l.lon,+l.lat]}:null);
    return save(`${slug(l.name)}_${today}.geojson`, JSON.stringify({type:"FeatureCollection",features:[{type:"Feature",properties:props(l),geometry}]},null,1)); }
  if(kind==="obs"){ const head=["date",...OBS.map(o=>o[0]),"source","note"]; return save(`${slug(l.name)}_obs_${today}.csv`, "﻿"+[head.join(","),...obsRows.map(r=>head.map(k=>csvCell(r[k])).join(","))].join("\n")); }
  if(kind==="csv"){ const head=["id",...F.map(f=>f[0]),"updated_at","updated_by_email"]; return save(`lakes_passports_${today}.csv`, "﻿"+[head.join(","),...[...lakes.values()].map(x=>head.map(k=>csvCell(k==="id"?x.id:x[k])).join(","))].join("\n")); }
  if(kind==="geoall"){ const feats=[]; for(const x of lakes.values()){ const g=await ensureGeom(x.id); const geometry=g||(x.lat!=null&&x.lat!==""?{type:"Point",coordinates:[+x.lon,+x.lat]}:null); feats.push({type:"Feature",properties:props(x),geometry}); }
    return save(`lakes_${today}.geojson`, JSON.stringify({type:"FeatureCollection",features:feats})); }
  if(kind==="print"){ return printPassport(l); }
  if(kind==="html"){ return save(`passport_${slug(l.name)}_${today}.html`, passportHTML(l)); }
}
function passportHTML(l){
  const m = morphCalc(l.id);
  const rows = g => F.filter(f=>f[4]===g).map(f=>{ const v=fieldValue(f,l[f[0]]); return `<tr><th>${esc(fl(f))}</th><td>${v===null?"—":v.replace(/<span class="chip [a-z]+">|<\/span>/g,"")}</td></tr>`; }).join("");
  const svg = (()=>{ const g=geoms.get(l.id); if(!g||!g.geometry) return ""; const bb=turf.bbox({type:"Feature",geometry:g.geometry}); const k=Math.cos((bb[1]+bb[3])/2*Math.PI/180); const w=(bb[2]-bb[0])*k||1e-6, h=(bb[3]-bb[1])||1e-6, S=300/Math.max(w,h);
    const ring=r=>r.map((c,i)=>`${i?"L":"M"}${((c[0]-bb[0])*k*S+10).toFixed(1)},${((bb[3]-c[1])*S+10).toFixed(1)}`).join("")+"Z";
    const polys = g.geometry.type==="Polygon"?[g.geometry.coordinates]:g.geometry.coordinates; const d=polys.map(p=>p.map(ring).join("")).join("");
    return `<svg viewBox="0 0 ${(w*S+20).toFixed(0)} ${(h*S+20).toFixed(0)}" width="${(w*S+20).toFixed(0)}" style="max-width:100%"><path d="${d}" fill="#bcd9e4" stroke="#1b6f8f" stroke-width="1.2" fill-rule="evenodd"/></svg>`; })();
  const obsT = obsRows.length ? `<h2>${esc(t("tObs"))}</h2><table class="o"><tr><th>${esc(t("date"))}</th>${OBS.map(o=>`<th>${esc(t(o[1]))}</th>`).join("")}<th>${esc(t("source"))}</th></tr>${obsRows.map(r=>`<tr><td>${esc(r.date)}</td>${OBS.map(o=>`<td>${r[o[0]]??""}</td>`).join("")}<td>${esc(r.source||"")}</td></tr>`).join("")}</table>` : "";
  return `<!DOCTYPE html><html lang="${lang}"><head><meta charset="utf-8"><title>${esc(t("tPass"))}: ${esc(l.name)}</title><style>
  body{font:13px/1.45 "Noto Sans",Arial,sans-serif;color:#18252a;max-width:820px;margin:24px auto;padding:0 20px}
  h1{font:700 24px "Noto Serif",Georgia,serif;margin:0 0 2px} .sub{color:#5b6b70;margin-bottom:16px} h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#0b6e79;border-bottom:1px solid #d5dddc;padding-bottom:3px;margin:18px 0 6px}
  table{border-collapse:collapse;width:100%} th,td{text-align:left;padding:3px 6px;vertical-align:top;border-bottom:1px solid #eef1f0} th{width:42%;color:#5b6b70;font-weight:500}
  table.o th,table.o td{width:auto;font-size:11.5px;text-align:right} table.o th:first-child,table.o td:first-child{text-align:left}
  .grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start} footer{margin-top:24px;color:#8a9a9e;font-size:11px}
  @media print{body{margin:0}} @media (max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
  <div class="sub">${esc(t("subtitle"))}</div><h1>${esc(t("tPass"))}: ${esc(l.name||"")}</h1><div class="sub">${esc([l.name_ru,l.code&&("№ "+l.code),l.region,l.district].filter(Boolean).join(" · "))}</div>
  <div class="grid"><div><h2>${esc(t("gId"))}</h2><table>${rows("id")}</table><h2>${esc(t("gLoc"))}</h2><table>${rows("loc")}</table></div><div>${svg}${m?`<table><tr><th>${esc(t("mArea"))}</th><td>${num(m.A,4)} ${t("km2")}</td></tr><tr><th>${esc(t("mPer"))}</th><td>${num(m.P,3)} ${t("km")}</td></tr><tr><th>Ks</th><td>${num(m.Ks,3)}</td></tr></table>`:""}</div></div>
  <h2>${esc(t("gMorph"))}</h2><table>${rows("morph")}</table><h2>${esc(t("gHydro"))}</h2><table>${rows("hydro")}</table><h2>${esc(t("gEco"))}</h2><table>${rows("eco")}</table><h2>${esc(t("gSrc"))}</h2><table>${rows("src")}</table>${obsT}
  <footer>${esc(t("title"))} · ${new Date().toLocaleDateString(LOC())} · ID ${esc(l.id)}</footer></body></html>`;
}
$("#btn-export").onclick = ()=>{ openModal(`<h3>${esc(t("expAll"))}</h3><div class="actions"><button class="btn" data-x="csv">${esc(t("expCsv"))}</button><button class="btn" data-x="geoall">${esc(t("expGeoAll"))}</button><button class="btn" data-close>${esc(t("close"))}</button></div>`); $("#mbox").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ const k=b.dataset.x; closeModal(); doExport(k); }); };

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  ["ru","az","en"].forEach(x=>$("#lang-"+x).setAttribute("aria-pressed",String(lang===x)));
  fillSelects(); drawBase(); setDb(dbState); renderList(); if(selId) renderDrawer();
  if(lastGate && $("#gate").classList.contains("open")) lastGate();
}
$("#lang-ru").onclick=()=>{ lang='ru'; ls.set('lakes-lang','ru'); applyLang(); };
$("#lang-az").onclick=()=>{ lang='az'; ls.set('lakes-lang','az'); applyLang(); };
$("#lang-en").onclick=()=>{ lang='en'; ls.set('lakes-lang','en'); applyLang(); };

/* ---------- data wiring ---------- */
let dbState = "load", firstFit = true;
const SEL = ["id",...COLS,"created_at","created_by_email","updated_at","updated_by_email"].join(",");
function setDb(s){ dbState=s; const dot=$("#dbdot"); dot.className="dot"+(s==="on"?" on":s==="off"?" off":"");
  $("#dbstat").textContent = s==="on" ? `${me?me.email:""} · ${t("role_"+myRole)}${myCountry?" · "+myCountry:""}` : s==="off"?t("dbOffline"):t("dbLoad"); }
function setLake(row){ lakes.set(row.id, {...row, hasGeom:!!row.geojson}); if(row.geojson) geoms.set(row.id,{geometry:row.geojson}); else geoms.delete(row.id); }
async function loadLakes(){
  setDb("load");
  try{
    let all=[], from=0; const page=500;
    while(true){ const rows = chk(await sb.from("lakes").select(SEL).order("name").range(from, from+page-1)); all=all.concat(rows); if(rows.length<page) break; from+=page; }
    lakes.clear(); geoms.clear(); all.forEach(setLake);
    setDb("on"); fillSelects(); renderList(); renderLayer(); if(selId && !editing) renderDrawer();
    if(firstFit){ firstFit=false; const h=location.hash.match(/^#lake-(.+)$/); if(h && lakes.has(h[1])) select(h[1],true); else if(lakes.size) fitAll(); }
  }catch(err){ setDb("off"); failMsg(err); }
}
async function loadMembers(){ try{ members = chk(await sb.from("lab_members").select("*").order("email")); }catch(e){ members=[]; } }
let rt = null, rtTimer = null;
function startRealtime(){
  if(rt) sb.removeChannel(rt);
  rt = sb.channel("lakes-rt")
    .on("postgres_changes",{event:"*",schema:"public",table:"lakes"}, p=>{
      if(p.eventType==="DELETE"){ lakes.delete(p.old.id); geoms.delete(p.old.id); if(selId===p.old.id) select(null); }
      else { const r={...p.new}; delete r.geom; delete r.pt; setLake(r); }
      clearTimeout(rtTimer); rtTimer=setTimeout(()=>{ renderList(); renderLayer(); if(selId && !editing) renderDrawer(); }, 300);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"lake_obs"}, p=>{ if(selId && (p.new?.lake_id===selId || p.eventType==="DELETE")) loadObs(selId); })
    .on("postgres_changes",{event:"*",schema:"public",table:"lake_photos"}, p=>{ if(selId && (p.new?.lake_id===selId || p.eventType==="DELETE")) loadPhotos(selId); })
    .subscribe();
}
window.addEventListener("hashchange", ()=>{ const h=location.hash.match(/^#lake-(.+)$/); if(h && h[1]!==selId && lakes.has(h[1])) select(h[1],true); });

/* ---------- auth screens ---------- */
function gate(html){ const g=$("#gate"); g.innerHTML=`<div class="gbox"><h2>${esc(t("title"))}</h2><p class="note">${esc(t("subtitle"))}</p>${html}</div>`; g.classList.add("open"); return g; }
function closeGate(){ lastGate=null; $("#gate").classList.remove("open"); $("#gate").innerHTML=""; }
let lastGate = null;
function showSetup(){
  lastGate = showSetup;
  const g = gate(`<p>${esc(t("setupTxt"))}</p><form id="sf" class="gform">
    <label for="sf-url">Project URL<input type="text" id="sf-url" required placeholder="https://xxxx.supabase.co"></label>
    <label for="sf-key">anon public key<textarea id="sf-key" required rows="3"></textarea></label>
    <button class="btn pri" type="submit">${esc(t("connect"))}</button></form>`);
  $("#sf").onsubmit=e=>{ e.preventDefault(); ls.set("lakes-sb-url",$("#sf-url").value.trim()); ls.set("lakes-sb-key",$("#sf-key").value.trim()); location.reload(); };
}
function showLogin(mode="in", msg=""){
  lastGate = ()=>showLogin(mode, msg);
  const g = gate(`${msg?`<div class="warnbox">${esc(msg)}</div>`:""}<form id="lf" class="gform">
    <label for="lf-email">E-mail<input type="email" id="lf-email" autocomplete="username" required></label>
    ${mode!=="reset"?`<label for="lf-pass">${esc(t("password"))}<input type="password" id="lf-pass" autocomplete="${mode==="up"?"new-password":"current-password"}" minlength="8" required></label>`:""}
    <button class="btn pri" type="submit">${esc(t(mode==="up"?"signUp":mode==="reset"?"sendReset":"signIn"))}</button>
    <div class="glinks">${mode!=="in"?`<button type="button" class="btn ghost sm" data-m="in">${esc(t("haveAcc"))}</button>`:""}${mode!=="up"?`<button type="button" class="btn ghost sm" data-m="up">${esc(t("firstTime"))}</button>`:""}${mode!=="reset"?`<button type="button" class="btn ghost sm" data-m="reset">${esc(t("forgot"))}</button>`:""}</div>
    ${mode==="up"?`<p class="note">${esc(t("signUpNote"))}</p>`:""}</form>`);
  g.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>showLogin(b.dataset.m));
  $("#lf").onsubmit=async e=>{ e.preventDefault(); const email=$("#lf-email").value.trim().toLowerCase(), pass=$("#lf-pass")?.value; const btn=e.target.querySelector("button[type=submit]"); btn.disabled=true;
    try{
      if(mode==="in"){ chk(await sb.auth.signInWithPassword({email, password:pass})); }
      else if(mode==="up"){ const r=chk(await sb.auth.signUp({email, password:pass, options:{emailRedirectTo: location.origin+location.pathname}})); if(!r.session) showLogin("in", t("checkMail")); }
      else { chk(await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin+location.pathname})); showLogin("in", t("resetSent")); }
    }catch(err){ btn.disabled=false; const m=err.message||String(err); showLogin(mode, /Invalid login/i.test(m)?t("badLogin"):/not confirmed/i.test(m)?t("notConfirmed"):m); }
  };
}
function showSetPassword(){
  lastGate = showSetPassword;
  const g = gate(`<p>${esc(t("newPassTxt"))}</p><form id="pf2" class="gform"><label for="np">${esc(t("newPass"))}<input type="password" id="np" minlength="8" autocomplete="new-password" required></label><button class="btn pri" type="submit">${esc(t("save"))}</button></form>`);
  $("#pf2").onsubmit=async e=>{ e.preventDefault(); try{ chk(await sb.auth.updateUser({password:$("#np").value})); toast(t("saved")); history.replaceState(null,"",location.pathname); closeGate(); afterLogin(); }catch(err){ toast(err.message,5000); } };
}
function showNoAccess(){
  lastGate = showNoAccess;
  const g = gate(`<div class="warnbox">${esc(t("noAccess").replace("{e}", me.email))}</div><div class="actions"><button class="btn" id="na-out">${esc(t("signOut"))}</button></div>`);
  $("#na-out").onclick=()=>sb.auth.signOut();
}
let afterP = null;
function afterLogin(){ return afterP || (afterP = doAfterLogin().catch(e=>{ afterP=null; failMsg(e); })); }
async function doAfterLogin(){
  const { data:{ user:u } } = await sb.auth.getUser(); if(!u){ showLogin(); return; }
  me = u;
  const r = await sb.from("lab_members").select("role,country").eq("email", (u.email||"").toLowerCase()).maybeSingle();
  myRole = r.data && r.data.role; myCountry = (r.data && r.data.country) || "AZ";
  if(!myRole){ afterP=null; showNoAccess(); return; }
  canWrite = myRole==="admin" || myRole==="editor"; isAdmin = myRole==="admin";
  closeGate(); $("#userbox").hidden=false; $("#btn-members").hidden=!isAdmin;
  await loadMembers(); await loadLakes(); startRealtime();
}

  $("#cpf").onsubmit=async e=>{ e.preventDefault(); try{ chk(await sb.auth.updateUser({password:$("#cp-n").value})); closeModal(); toast(t("saved")); }catch(err){ toast(err.message,5000); } }; };

    </tbody></table></div>
    <form id="mf" class="form" style="margin-top:12px"><label for="mf-e">E-mail<input type="email" id="mf-e" required></label><label for="mf-n">${esc(t("fullName"))}<input type="text" id="mf-n"></label>
    <label for="mf-r">${esc(t("role"))}<select id="mf-r">${roles.map(r=>`<option value="${r}"${r==="editor"?" selected":""}>${esc(t("role_"+r))}</option>`).join("")}</select></label>
    <label for="mf-c">${esc(fl(F.find(f=>f[0]==="country")))}<select id="mf-c">${COUNTRY.map(c=>`<option value="${c[0]}">${esc(lbl(c))}</option>`).join("")}</select></label>
    <div class="actions" style="align-self:end;margin:0"><button class="btn pri" type="submit">${esc(t("addMember"))}</button></div></form>
    <div class="actions"><button class="btn" data-close>${esc(t("close"))}</button></div>`);
  $("#mf").onsubmit=async e=>{ e.preventDefault(); try{ chk(await sb.from("lab_members").upsert({email:$("#mf-e").value.trim().toLowerCase(), full_name:$("#mf-n").value.trim()||null, role:$("#mf-r").value, country:$("#mf-c").value})); renderMembers(); toast(t("saved")); }catch(err){ failMsg(err); } };
  $("#mbox").querySelectorAll("[data-role]").forEach(s=>s.onchange=async()=>{ try{ chk(await sb.from("lab_members").update({role:s.value}).eq("email", s.dataset.role)); toast(t("saved")); }catch(err){ failMsg(err); } });
  $("#mbox").querySelectorAll("[data-cty]").forEach(s=>s.onchange=async()=>{ try{ chk(await sb.from("lab_members").update({country:s.value}).eq("email", s.dataset.cty)); toast(t("saved")); }catch(err){ failMsg(err); } });
  $("#mbox").querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{ try{ chk(await sb.from("lab_members").delete().eq("email", b.dataset.rm)); renderMembers(); }catch(err){ failMsg(err); } });
}

/* ---------- start ---------- */
fillSelects(); applyLang(); setDb("load");
(async()=>{
  const c = cfg();
  if(!c.url || !c.key){ showSetup(); return; }
  const recovering = /type=(recovery|invite)/.test(location.hash);
  try{ sb = supabase.createClient(c.url, c.key); }catch(err){ showSetup(); toast(err.message,6000); return; }
  sb.auth.onAuthStateChange((ev, session)=>{
    if(ev==="PASSWORD_RECOVERY"){ showSetPassword(); return; }
    if(ev==="SIGNED_OUT"){ afterP=null; me=null; $("#userbox").hidden=true; showLogin(); return; }
    if(ev==="SIGNED_IN" && !recovering) setTimeout(afterLogin, 0);
  });
  const { data:{ session } } = await sb.auth.getSession();
  if(recovering && session){ showSetPassword(); return; }
  if(session) afterLogin(); else showLogin();
})();
